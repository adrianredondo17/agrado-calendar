
name: Actualizar calendario Yeguada Agrado

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar participantes confirmados"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '0 13 * * *'
      timezone: 'Europe/Madrid'

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install requests beautifulsoup4 lxml

      - name: Ejecutar extractor y generar vista previa
        env:
          PUBLISH: "false"
        run: |
          python update_calendar.py

      - name: Guardar vista previa de participaciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-preview
          path: calendar-preview.json
          if-no-files-found: warn
          retention-days: 30
