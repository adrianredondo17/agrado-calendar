
name: Actualizar calendario Yeguada Agrado

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar participaciones y victorias"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '0 13 * * *'
      timezone: 'Europe/Madrid'

permissions:
  contents: write

concurrency:
  group: agrado-calendar-update
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install requests beautifulsoup4 lxml

      - name: Actualizar participaciones
        env:
          SHOULD_PUBLISH: ${{ (github.event_name == 'schedule' || inputs.publish == true) && 'true' || 'false' }}
        run: |
          if [ "$SHOULD_PUBLISH" = "true" ]; then
            python update_calendar.py --publish
          else
            python update_calendar.py
          fi

      - name: Detectar victorias españolas
        env:
          SHOULD_PUBLISH: ${{ (github.event_name == 'schedule' || inputs.publish == true) && 'true' || 'false' }}
        run: |
          if [ "$SHOULD_PUBLISH" = "true" ]; then
            python auto_wins.py --publish
          else
            python auto_wins.py
          fi

      - name: Eliminar participaciones finalizadas
        env:
          SHOULD_PUBLISH: ${{ (github.event_name == 'schedule' || inputs.publish == true) && 'true' || 'false' }}
        run: |
          if [ "$SHOULD_PUBLISH" = "true" ]; then
            python cleanup_participants.py --publish
          else
            python cleanup_participants.py
          fi

      - name: Guardar vista previa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-preview
          path: calendar-preview.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar calendario actualizado
        if: github.event_name == 'schedule' || inputs.publish == true
        run: |
          if git diff --quiet -- calendar.json; then
            echo "Sin cambios en calendar.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar.json
          git commit -m "Actualizar calendario Yeguada Agrado"
          git push
